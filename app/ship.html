<style>
:root{color-scheme:dark;--bg:#0b0e19;--panel:rgba(16,20,34,.86);--line:#2a3149;--text:#e8ecf5;--muted:#a3adc5;--cyan:#90e0e4;--amber:#ffc56b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hint{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));max-width:min(46vw,260px);text-align:right;font-size:13px;line-height:1.35;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;pointer-events:none;transition:opacity .6s}
.call,.panel{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 124px);display:none;z-index:7}
@media (max-height:520px){.panel #floors{display:grid;grid-template-columns:1fr 1fr;gap:0 6px}.panel{bottom:calc(max(22px,env(safe-area-inset-bottom)) + 112px)}}
.call{border:0;border-radius:16px;padding:14px 18px;background:var(--amber);color:#1b1305;font-weight:700;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.45)}

.panel button.here b{background:var(--cyan)}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#18203a,#0b0e19 70%);text-align:center;padding:24px}

@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(144,224,228,.25)}}
#radar{margin-left:auto;width:104px;height:104px;border-radius:50%;pointer-events:auto;border:2px solid rgba(144,224,228,.75);background:rgba(10,14,26,.72);box-shadow:0 4px 16px rgba(0,0,0,.35)}

.logHead{display:flex;align-items:center;justify-content:space-between;color:var(--cyan);margin-bottom:6px}.logHead button{border:0;background:none;color:var(--text);font-size:22px}
#logList{max-height:calc(45vh - 50px);overflow-y:auto;font-size:15px;line-height:1.45}#logList p{margin:0 0 8px}#logList .you{color:#c9cfe6}#logList .note{color:var(--muted);font-size:13px}#logList b{color:var(--cyan)}

.say-unused{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 172px);transform:translateX(-50%);width:min(88vw,520px);text-align:center;font-size:16px;line-height:1.4;color:#fff;text-shadow:0 1px 3px #000,0 0 10px #000;pointer-events:none;opacity:0;transition:opacity .35s}

.bigmap{position:fixed;inset:0;display:none;background:rgba(6,9,18,.94);z-index:5}

.bigmap .close{position:absolute;right:16px;top:max(12px,env(safe-area-inset-top));border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;width:42px;height:42px;font-size:20px}
.comms{position:fixed;display:none;z-index:6;border:1.5px solid #90e0e4;border-radius:12px;box-shadow:0 0 22px #90e0e455,inset 0 0 0 1px #0008;pointer-events:none;overflow:hidden}.comms.live{border-color:#7dffb0;box-shadow:0 0 26px #7dffb077}.comms b{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.06em;color:#dff;background:linear-gradient(transparent,#000c);text-transform:uppercase}

/* comm screen: the person you are with, between the two sticks. A clipped holo frame, a name tab on its side, angled buttons */
.holo{position:fixed;z-index:6;pointer-events:none;--c:#90e0e4;--cut:14px}
.holo.live{--c:#7dffb0}.holo.off{--c:#ff7a7a}

.holo .scr::after{content:'';position:absolute;left:0;right:0;height:28%;top:-30%;background:linear-gradient(transparent,rgba(144,224,228,.16),transparent);animation:sweep 3.2s linear infinite}
@keyframes sweep{to{top:110%}}

.holo .btns button:active{background:var(--c);color:#06222a}
.holo .btns .hang{background:rgba(120,20,26,.9);border-color:#ff7a7a}.holo .btns .dial{background:rgba(16,90,52,.9);border-color:#7dffb0}

@keyframes noise{50%{background-position:3px 2px}}
.holo.off .msg,.holo.dialing .msg{display:grid;background-color:rgba(8,18,26,.92);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);padding:0 10px}
.holo.mini .scr,.holo.mini svg,.holo.mini .side,.holo.mini .msg{display:none}

.holo .btns .fo{display:none}.holo.full .btns .fo{display:grid}
.holo .btns button.on{background:var(--c);color:#06222a}

.holo.full .side{display:none}

body.holofull .hud,body.holofull .row2,body.holofull .knob,body.holofull .call,body.holofull .panel{display:none!important}
#radar{position:fixed;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 8px);transform:translateX(-50%);margin:0;width:min(96px,calc(100vw - 2*(max(18px,env(safe-area-inset-left)) + 112px)));height:auto;aspect-ratio:1}
.typebar{right:14px}

.holo .crew{position:absolute;right:0;bottom:calc(100% + 30px);display:flex;gap:6px;pointer-events:none}

.holo.full .mate{width:78px;height:94px}.holo.mini .crew{display:none}

/* full screen call: a holo messenger panel (owner's references): header, nav, the video, round call buttons, call log + messages */
.holo.full{display:none!important}
.callui{position:fixed;inset:0;z-index:6;display:none;grid-template-columns:168px 1fr 220px;grid-template-rows:auto 1fr 84px;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));--c:#7fd8ff;font-family:system-ui,sans-serif;color:#e8f6ff}

.cu-head .cuw{margin-left:auto;color:#9fc6dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cu-head .clock{color:#bfe9ff;font-variant-numeric:tabular-nums}
.cu-nav{grid-row:2/4;display:flex;flex-direction:column;gap:8px;padding:10px 8px;overflow:auto}
.cu-nav button{display:grid;grid-template-columns:30px 1fr;align-items:center;text-align:left;gap:2px 8px;border:1px solid rgba(127,216,255,.25);background:rgba(10,28,48,.7);color:#e8f6ff;padding:9px 10px;border-radius:10px;font-size:20px}
.cu-nav button b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}.cu-nav button small{grid-column:2;font-size:10px;color:#8fb6cc;letter-spacing:.06em}
.cu-nav button.on{border-color:var(--c);background:rgba(40,110,170,.45);box-shadow:0 0 12px rgba(127,216,255,.4)}
.cu-pic{position:relative;grid-column:2;grid-row:2;min-height:0}
.cu-pic svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 8px var(--c))}

.cu-name{position:absolute;left:18px;bottom:16px;text-shadow:0 2px 8px #000}.cu-name b{display:block;font-size:26px;letter-spacing:.18em;text-transform:uppercase}.cu-name small{color:#7dffb0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.cu-name.off small{color:#ff8a8a}
.cu-crew{position:absolute;right:12px;top:12px;display:flex;gap:6px;pointer-events:none}
.cu-crew .mate{position:relative;width:72px;height:88px;border:1px solid var(--c);background:#0a1c26;overflow:hidden;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cu-crew .mate img,.cu-crew .mate video{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.cu-crew .mate b{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font:700 9px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#e9fdff;background:linear-gradient(transparent,#000c)}
.cu-msg{position:absolute;inset:0;display:none;place-items:center;color:#ff9a9a;font-weight:800;letter-spacing:.2em;font-size:13px;text-transform:uppercase;background:rgba(6,14,24,.92)}
.cu-pic.off .cu-msg,.cu-pic.dialing .cu-msg{display:grid}.cu-pic.dialing .cu-msg{color:#7dffb0}
.cu-bar{grid-column:2;grid-row:3;display:flex;justify-content:center;align-items:center;gap:14px}

.cu-bar button.end span{background:#d92d3a;border-color:#ff8a8a;color:#fff}.cu-bar button.dial span{background:#1f9e5a;border-color:#7dffb0;color:#fff}
.cu-side{grid-row:2/4;display:flex;flex-direction:column;gap:8px;min-height:0}
.cu-side section{flex:1;min-height:0;overflow:auto;padding:10px 10px 6px}

.cu-row img,.cu-row i{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#123;border:1px solid rgba(127,216,255,.5);display:grid;place-items:center;font-style:normal;font-weight:700}

.cu-row.now{background:rgba(60,140,210,.25);border-radius:8px}
.cu-say{font-size:12px;line-height:1.35;padding:6px 4px;border-bottom:1px solid rgba(127,216,255,.12)}.cu-say b{color:#9fe3ff;margin-right:4px}.cu-say.you b{color:#c9cfe6}
@media (orientation:portrait){
 .callui{grid-template-columns:1fr;grid-template-rows:auto minmax(0,52vh) 86px minmax(0,1fr)}
 .cu-nav{display:none}.cu-pic,.cu-bar,.cu-side{grid-column:1}.cu-pic{grid-row:2}.cu-bar{grid-row:3;gap:10px}.cu-side{grid-row:4;flex-direction:row}

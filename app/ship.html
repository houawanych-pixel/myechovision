<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0e19"><title>My EchoVision — Walk the ship</title>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<style>
:root{color-scheme:dark;--bg:#0b0e19;--panel:rgba(16,20,34,.86);--line:#2a3149;--text:#e8ecf5;--muted:#a3adc5;--cyan:#90e0e4;--amber:#ffc56b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;pointer-events:none}
.hud a,.hud button{pointer-events:auto}
.back{color:var(--text);text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.where{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--cyan);font-weight:600}
#stick{position:fixed;left:0;bottom:0;width:50%;height:55%}
.knob{position:fixed;left:calc(max(22px,env(safe-area-inset-left)) + 66px);bottom:calc(max(26px,env(safe-area-inset-bottom)) + 66px);width:132px;height:132px;margin:0 0 -66px -66px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(255,255,255,.16);pointer-events:none;box-shadow:0 0 18px rgba(144,224,228,.55),inset 0 0 0 10px rgba(255,255,255,.08)}
.knob::before,.knob::after{content:'';position:absolute;left:50%;top:50%;border:7px solid transparent;opacity:.95}
.knob::before{margin:-62px 0 0 -7px;border-bottom-color:#e8ecf5}
.knob::after{margin:48px 0 0 -7px;border-top-color:#e8ecf5}
.knob b{position:absolute;top:50%;margin-top:-7px;border:7px solid transparent;opacity:.95}
.knob b.l{left:2px;border-right-color:#e8ecf5}.knob b.r{right:2px;border-left-color:#e8ecf5}
.knob i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(144,224,228,.8),0 4px 14px rgba(0,0,0,.35);transition:transform .08s}
.knob.on i{transition:none}
.knob.look{left:auto;right:calc(max(22px,env(safe-area-inset-right)) + 66px);margin:0 -66px -66px 0;border-color:rgba(144,224,228,.9);background:rgba(144,224,228,.12)}
.hint{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));max-width:min(46vw,260px);text-align:right;font-size:13px;line-height:1.35;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;pointer-events:none;transition:opacity .6s}
.call,.panel{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(max(26px,env(safe-area-inset-bottom)) + 168px);display:none}
.call{border:0;border-radius:16px;padding:14px 18px;background:var(--amber);color:#1b1305;font-weight:700;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:6px 0 0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#1b2238;color:var(--text);font-size:16px;font-weight:600}
.panel button.here{border-color:var(--cyan);color:var(--cyan)}
.panel button.go{background:var(--amber);color:#1b1305;border-color:var(--amber)}
.panel button b{width:10px;height:10px;border-radius:50%;background:#3a4463}
.panel button.here b{background:var(--cyan)}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#18203a,#0b0e19 70%);text-align:center;padding:24px}
.start h1{margin:0;font-size:clamp(26px,7vw,44px);letter-spacing:.06em}
.start p{margin:0;color:var(--muted);max-width:30em;line-height:1.5}
.start button{margin-top:8px;border:0;border-radius:999px;padding:14px 28px;background:var(--text);color:#0b0e19;font-weight:700;font-size:17px}
.start button:disabled{opacity:.5}
.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
.row2{position:fixed;left:0;right:0;top:calc(max(10px,env(safe-area-inset-top)) + 50px);display:flex;align-items:flex-start;gap:8px;padding:0 14px;pointer-events:none}
.row2 button{pointer-events:auto}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--cyan);color:#06222a;border-color:var(--cyan);box-shadow:0 0 14px rgba(144,224,228,.6)}
.chip.listen{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(144,224,228,.25)}}
#radar{margin-left:auto;width:104px;height:104px;border-radius:50%;pointer-events:auto;border:2px solid rgba(144,224,228,.75);background:rgba(10,14,26,.72);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.typebar{position:fixed;left:14px;right:132px;top:calc(max(10px,env(safe-area-inset-top)) + 100px);display:none;gap:8px}
.typebar input{flex:1;min-width:0;border:1px solid var(--cyan);background:rgba(10,14,26,.92);color:var(--text);border-radius:14px;padding:12px 14px;font-size:16px}
.typebar button{border:0;border-radius:14px;padding:0 16px;background:var(--cyan);color:#06222a;font-weight:700;font-size:15px}
.log{position:fixed;left:14px;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 100px);max-height:45vh;display:none;background:rgba(10,14,26,.94);border:1px solid var(--line);border-radius:16px;padding:10px 14px;z-index:4}
.logHead{display:flex;align-items:center;justify-content:space-between;color:var(--cyan);margin-bottom:6px}.logHead button{border:0;background:none;color:var(--text);font-size:22px}
#logList{max-height:calc(45vh - 50px);overflow-y:auto;font-size:15px;line-height:1.45}#logList p{margin:0 0 8px}#logList .you{color:#c9cfe6}#logList .note{color:var(--muted);font-size:13px}#logList b{color:var(--cyan)}
.chip.dot{position:relative}.chip.dot::after{content:'';position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.say-unused{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 172px);transform:translateX(-50%);width:min(88vw,520px);text-align:center;font-size:16px;line-height:1.4;color:#fff;text-shadow:0 1px 3px #000,0 0 10px #000;pointer-events:none;opacity:0;transition:opacity .35s}
.say b{color:var(--cyan)}.say.you{color:#d8dcef;font-size:14px}
.bigmap{position:fixed;inset:0;display:none;background:rgba(6,9,18,.94);z-index:5}
.bigmap canvas{width:100%;height:100%;display:block}
.bigmap .title{position:absolute;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;font-weight:700;letter-spacing:.08em;color:var(--cyan)}
.bigmap .close{position:absolute;right:16px;top:max(12px,env(safe-area-inset-top));border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;width:42px;height:42px;font-size:20px}
.comms{position:fixed;display:none;z-index:6;border:1.5px solid #90e0e4;border-radius:12px;box-shadow:0 0 22px #90e0e455,inset 0 0 0 1px #0008;pointer-events:none;overflow:hidden}.comms.live{border-color:#7dffb0;box-shadow:0 0 26px #7dffb077}.comms b{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.06em;color:#dff;background:linear-gradient(transparent,#000c);text-transform:uppercase}

/* comm screen: the person you are with, between the two sticks. A clipped holo frame, a name tab on its side, angled buttons */
.holo{position:fixed;z-index:6;pointer-events:none;--c:#90e0e4;--cut:14px}
.holo.live{--c:#7dffb0}.holo.off{--c:#ff7a7a}
.holo .scr{position:absolute;left:0;right:0;top:0;bottom:50px;pointer-events:auto;cursor:zoom-in;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.holo.full .scr{cursor:zoom-out}
.holo .scr::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(144,224,228,.10) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(4,14,22,.55));mix-blend-mode:screen}
.holo .scr::after{content:'';position:absolute;left:0;right:0;height:28%;top:-30%;background:linear-gradient(transparent,rgba(144,224,228,.16),transparent);animation:sweep 3.2s linear infinite}
@keyframes sweep{to{top:110%}}
.holo .scr i{position:absolute;inset:0;animation:flick 5s steps(1) infinite;background:rgba(144,224,228,.0)}
@keyframes flick{0%,100%{background:transparent}93%{background:rgba(144,224,228,.10);transform:translateX(2px)}95%{background:transparent;transform:none}}
.holo svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 6px var(--c))}
.holo .tab{position:absolute;left:-2px;top:-26px;height:24px;max-width:calc(100% + 30px);display:flex;align-items:center;gap:6px;padding:0 18px 0 10px;background:linear-gradient(90deg,rgba(10,30,40,.92),rgba(10,30,40,.75));border:1px solid var(--c);border-bottom:0;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 100%,0 100%);font:700 11px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#e9fdff;white-space:nowrap;overflow:hidden;pointer-events:auto}
.holo .tab em{font-style:normal;font-weight:600;color:var(--c);letter-spacing:.08em}
.holo .tab s{width:7px;height:7px;flex:none;background:var(--c);border-radius:50%;box-shadow:0 0 8px var(--c)}
.holo.live .tab s{animation:pulse2 .8s ease-in-out infinite}@keyframes pulse2{50%{opacity:.25}}
.holo .side{position:absolute;right:-7px;top:22%;width:5px;height:38%;background:repeating-linear-gradient(var(--c) 0 3px,transparent 3px 7px);opacity:.8}
.holo .btns{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.holo .btns button{width:46px;height:40px;font-size:18px!important;border:1px solid var(--c);background:rgba(8,22,32,.88);color:#e9fdff;font:700 14px/1 system-ui,sans-serif;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:0;display:grid;place-items:center}
.holo .btns button:active{background:var(--c);color:#06222a}
.holo .btns .hang{background:rgba(120,20,26,.9);border-color:#ff7a7a}.holo .btns .dial{background:rgba(16,90,52,.9);border-color:#7dffb0}
.holo .msg{position:absolute;inset:0 0 50px 0;display:none;place-items:center;text-align:center;font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.16em;color:var(--c);text-transform:uppercase;pointer-events:none;background:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);animation:noise .2s steps(2) infinite}
@keyframes noise{50%{background-position:3px 2px}}
.holo.off .msg,.holo.dialing .msg{display:grid;background-color:rgba(8,18,26,.92);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);padding:0 10px}
.holo.mini .scr,.holo.mini svg,.holo.mini .side,.holo.mini .msg{display:none}
.holo.mini .tab{top:auto;bottom:50px;left:50%;transform:translateX(-50%);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%);padding:0 16px;border-bottom:1px solid var(--c)}

.holo .btns .fo{display:none}.holo.full .btns .fo{display:grid}
.holo .btns button.on{background:var(--c);color:#06222a}
.holo.full .btns{gap:10px}.holo.full .btns button{width:60px;height:48px;font-size:22px!important}
.holo.full .scr,.holo.full .msg{bottom:74px;clip-path:none}.holo.full .msg{inset:0 0 74px 0}
.holo.full .tab{left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));height:30px;font-size:13px;border-bottom:1px solid var(--c)}
.holo.full .side{display:none}
.holo.full::before{content:"";position:absolute;left:0;right:0;bottom:0;height:74px;background:linear-gradient(#06101a,#03080e);border-top:1px solid var(--c);pointer-events:auto}.holo.full{transition:none}
body.holofull .hud,body.holofull .row2,body.holofull .knob,body.holofull .call,body.holofull .panel{display:none!important}
#radar{position:fixed;left:50%;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 14px);transform:translateX(-50%);margin:0;width:min(104px,calc(100vw - 2*(max(22px,env(safe-area-inset-left)) + 140px)));height:auto;aspect-ratio:1}
.typebar{right:14px}
body.holofull .log,body.holofull .typebar{z-index:8}

.holo .crew{position:absolute;right:0;bottom:calc(100% + 30px);display:flex;gap:6px;pointer-events:none}
.holo .mate{position:relative;width:58px;height:70px;border:1px solid var(--c);background:#0a1c26;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);overflow:hidden;box-shadow:0 0 8px var(--c)}
.holo .mate img,.holo .mate video{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.holo .mate b{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font:700 9px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#e9fdff;background:linear-gradient(transparent,#000c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.holo .mate::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(144,224,228,.12) 0 1px,transparent 1px 3px)}
.holo.full .crew{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));bottom:auto;flex-direction:row}
.holo.full .mate{width:78px;height:94px}.holo.mini .crew{display:none}
</style></head><body>
<canvas id="view"></canvas>
<div id="stick"></div><div class="knob" id="knob"><i></i><b class="l"></b><b class="r"></b></div><div class="knob look" id="knob2"><i></i><b class="l"></b><b class="r"></b></div>
<div class="hud"><a class="back" href="./">← My EchoVision</a><span class="where" id="where">Deck 5</span></div>
<div class="row2"><button class="chip" id="talkBtn">🎙 Talk</button><button class="chip" id="typeBtn">⌨ Type</button><button class="chip" id="logBtn">Log</button><canvas id="radar" width="208" height="208" aria-label="Map"></canvas></div>
<form class="typebar" id="typebar" autocomplete="off"><input id="typeIn" placeholder="Say something…" enterkeyhint="send"><button>Send</button></form>
<div class="log" id="log"><div class="logHead"><b>Log</b><button id="logClose" aria-label="Close log">×</button></div><div id="logList"></div></div>
<div class="bigmap" id="bigmap"><canvas id="mapc"></canvas><div class="title" id="mapTitle">Deck 5</div><button class="close" id="mapClose" aria-label="Close map">×</button></div>
<button class="call" id="call">Call lift</button>
<div class="panel" id="panel"><h3>Turbolift</h3><div id="floors"></div></div>
<div class="holo" id="holo"><div class="scr" id="holoScr"><i></i></div><svg id="holoSvg"></svg><div class="side"></div><div class="msg" id="holoMsg">No signal</div><div class="tab" id="holoTab"><s></s><span id="holoName"></span><em id="holoState"></em></div><div class="btns"><button id="hTalk" aria-label="Speak">🎙</button><button id="hType" class="fo" aria-label="Type">⌨</button><button id="hMin" aria-label="Minimise">▁</button><button id="hFull" aria-label="Full screen">⛶</button><button id="hLog" class="fo" aria-label="Call log">☰</button><button id="hCall" class="hang fo" aria-label="Hang up">✆</button></div></div>
<div class="fade" id="fade"></div>
<div class="start" id="start"><h1>Walk the ship</h1><p>Judy walks with you. Doors open as you reach them. Step into a lift and choose a deck.</p><button id="go" disabled>Loading the ship…</button></div>
<script type="module" src="ship.mjs?v=27"></script>
</body></html>
